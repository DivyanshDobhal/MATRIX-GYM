services:
  # MATRIX Express Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matrix_backend_app
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      - NVIDIA_MODEL=${NVIDIA_MODEL}
    restart: always
    networks:
      - matrix_network

  # Optional Database Service (MongoDB)
  database:
    image: mongo:8.0
    container_name: matrix_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - matrix_network

  # Frontend Placeholder Service
  frontend:
    image: nginx:alpine
    container_name: matrix_frontend_placeholder
    ports:
      - "8080:80"
    restart: always
    networks:
      - matrix_network

networks:
  matrix_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
